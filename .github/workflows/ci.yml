name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Health smoke
        run: |
          node server.js &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:5590/api/health && exit 0; sleep 1; done
          echo "health never answered"; exit 1
      - name: gitleaks
        run: |
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xz -f gitleaks_8.18.4_linux_x64.tar.gz gitleaks
          ./gitleaks detect --source . --redact --no-banner
      - name: No AI attribution
        run: bash scripts/check-no-ai-attribution.sh
